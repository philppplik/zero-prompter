[book]
title = "zero-teleprompter - Handbook"
authors = ["zero-teleprompter contributors"]
language = "en"
src = "src"
description = "User and developer handbook for zero-teleprompter (v0.1, untested)"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/philppplik/zero-prompter"
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

[preprocessor.mermaid]
command = "mdbook-mermaid"


