<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zero-teleprompter Mockup</title>
<style>
:root{--bg:#FBFBFC;--surface:#FFF;--sunken:#F3F3F5;--border:#E4E4E8;--text:#1B1C20;--muted:#5E6370;--accent:#6E56CF;--accentSub:#EEEAFB;--ring:#6E56CF;
--s-idle:#8A8F98;--s-listening:#4CC2FF;--s-tracking:#3DD68C;--s-hold:#FFB224;--s-lost:#F2555A;--s-resync:#8E7BFF;
--pr-bg:#0E0F12;--pr-text:#F4F1EA;--pr-marker:#FFB224;--pr-hl:rgba(255,178,36,.22);--pr-read:.4;--pr-ls:0;--pr-ws:0;--pr-lh:1.4;
--ease:cubic-bezier(.2,0,0,1);font-family:Inter,"Segoe UI Variable","Segoe UI",-apple-system,system-ui,sans-serif;font-size:13px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F12;--surface:#16171B;--sunken:#0A0B0D;--border:#2A2C33;--text:#E8E8EA;--muted:#9BA1AB;--accent:#8E7BFF;--accentSub:#231F3D;--ring:#A495FF}}
:root[data-theme="dark"]{--bg:#0E0F12;--surface:#16171B;--sunken:#0A0B0D;--border:#2A2C33;--text:#E8E8EA;--muted:#9BA1AB;--accent:#8E7BFF;--accentSub:#231F3D;--ring:#A495FF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;border-radius:6px;cursor:pointer;padding:4px 10px;min-height:28px;transition:background .12s var(--ease)}
button:hover{background:var(--sunken)}button:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.title{height:38px;font-weight:600}.toolbar{height:44px}.grow{flex:1}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:2px}.seg button{min-height:24px;padding:2px 10px}.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--border);font-weight:500}
.ic{width:12px;height:12px;display:inline-block}
.main{flex:1;display:grid;grid-template-columns:220px 1fr 290px;min-height:0}
aside{border-right:1px solid var(--border);padding:16px;overflow:auto;background:var(--surface)}aside.r{border-right:0;border-left:1px solid var(--border)}
.cap{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}.cap:first-child{margin-top:0}
.ol button{display:block;width:100%;text-align:left}.ol button.on{background:var(--accentSub);color:var(--accent);font-weight:600}
.center{padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;flex:1;border-radius:12px;overflow:hidden;background:var(--pr-bg);box-shadow:0 4px 12px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.05)}
.mirror{position:absolute;inset:0}.mirror.h{transform:scaleX(-1)}
.scroller{position:absolute;left:0;right:0;top:0;will-change:transform;padding:0 8%}
.script{max-width:32ch;margin:0 auto;color:var(--pr-text);font:500 var(--fs,40px)/var(--pr-lh) "Atkinson Hyperlegible Next",Inter,system-ui,sans-serif;letter-spacing:calc(var(--pr-ls)*1em);word-spacing:calc(var(--pr-ws)*1em)}
.script p{margin:0 0 .6em}.w{border-radius:4px;transition:background .12s,opacity .2s;cursor:pointer}.w.read{opacity:var(--pr-read)}.w.cur{background:var(--pr-hl)}.dir{font-style:italic;opacity:.55}
.marker{position:absolute;left:4%;right:4%;top:35%;height:2px;background:var(--pr-marker);pointer-events:none}
.marker::before{content:"";position:absolute;left:-14px;top:-7px;border:8px solid transparent;border-left:12px solid var(--pr-marker)}
.marker.hold{box-shadow:0 0 0 6px color-mix(in srgb,var(--s-hold) 30%,transparent)}
.cd{position:absolute;inset:0;display:none;place-items:center;font:700 120px/1 Inter,sans-serif;color:var(--pr-marker);font-variant-numeric:tabular-nums}.cd.on{display:grid}
.cd span{animation:pop 1s var(--ease)}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.th{border:1px solid var(--border);border-radius:8px;padding:0;overflow:hidden;text-align:left}
.th .sw{height:36px;display:flex;align-items:center;padding:0 8px;font-weight:700}.th .nm{padding:4px 8px;font-size:11px;display:flex;justify-content:space-between}.th[aria-pressed=true]{outline:2px solid var(--accent)}
label.f{display:block;margin:12px 0 4px;font-size:11px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}
.transport{height:56px;border-top:1px solid var(--border);border-bottom:0}
.play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px}.play:hover{background:var(--accent);filter:brightness(1.1)}
.num{font:600 13px ui-monospace,monospace;min-width:34px;text-align:center}.prog{flex:1;height:4px;background:var(--sunken);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
.pal{position:fixed;inset:0;background:rgba(15,16,20,.4);display:none;align-items:flex-start;justify-content:center;padding-top:15vh}.pal.on{display:flex}
.pal>div{width:min(600px,92vw);background:var(--surface);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:14px 16px;font:15px inherit;background:transparent;color:var(--text);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}.pal li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer}.pal li.sel{background:var(--accentSub);color:var(--accent)}
.pal footer{padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;display:flex;gap:12px}
@media (max-width:900px){.main{grid-template-columns:1fr}aside{display:none}.toolbar .hide{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar title"><span>zero-teleprompter</span><span style="color:var(--muted);font-weight:400">· Keynote_Q4.md</span><span class="grow"></span><button id="palBtn">Suchen <kbd>Ctrl K</kbd></button><button id="uiTheme" title="UI hell/dunkel">◐</button></div>
<div class="bar toolbar">
  <div class="seg" role="group" aria-label="Modus"><button aria-pressed="false">Edit</button><button aria-pressed="true">Live</button></div>
  <div class="seg hide" role="group" aria-label="Scroll-Modus" id="modeSeg"><button aria-pressed="false" data-m="manual">Manuell</button><button aria-pressed="true" data-m="const">Konstant</button><button aria-pressed="false" data-m="voice">Voice</button></div>
  <span class="grow"></span>
  <button class="pill" id="vstate" role="status" aria-live="polite" title="Klicken: Zustand simulieren"></button>
  <button id="mirBtn" aria-pressed="false" title="Spiegeln (M)">⇋ Spiegeln</button>
</div>
<div class="main">
  <aside><div class="cap">Outline</div><div class="ol" id="ol"></div>
    <div class="cap">Shortcuts</div><div style="line-height:2;color:var(--muted)"><kbd>Space</kbd> Play/Pause<br><kbd>↑</kbd><kbd>↓</kbd> Tempo ±5<br><kbd>PgUp</kbd><kbd>PgDn</kbd> Absatz<br><kbd>Home</kbd> Anfang<br><kbd>M</kbd> Spiegeln<br><kbd>V</kbd> Voice-Zustand<br><kbd>1</kbd>–<kbd>6</kbd> Theme</div></aside>
  <section class="center">
    <div class="stage" id="stage"><div class="mirror" id="mir"><div class="scroller" id="scroller"><div class="script" id="script"></div></div></div><div class="marker" id="marker"></div><div class="cd" id="cd"></div></div>
    <div style="color:var(--muted);font-size:12px">Talent-Vorschau · 1:1 verkleinert · Klick auf ein Wort = Resync</div>
  </section>
  <aside class="r">
    <div class="cap">Prompter-Theme</div><div class="themes" id="themes"></div>
    <div class="cap">Darstellung</div>
    <label class="f" for="fs">Schriftgröße <span id="fsv"></span></label><input type="range" id="fs" min="24" max="80" value="40">
    <label class="f" for="rd">Gelesen-Opazität <span id="rdv"></span></label><input type="range" id="rd" min="20" max="100" value="40">
  </aside>
</div>
<div class="bar transport">
  <button title="Anfang (Home)" id="home">⏮</button><button title="Absatz zurück" id="pPrev">◀¶</button>
  <button class="play" id="play" aria-label="Play">▶</button><button title="Absatz vor" id="pNext">¶▶</button>
  <button id="wDn" aria-label="Langsamer">−</button><span class="num" id="wpm">140</span><button id="wUp" aria-label="Schneller">+</button><span style="color:var(--muted)">WPM</span>
  <div class="prog"><i id="pg"></i></div><span class="num" id="tc" style="min-width:90px">00:00</span>
</div>
<div class="pal" id="pal"><div role="dialog" aria-label="Command Palette"><input id="palIn" placeholder="Befehl oder Theme suchen…" role="combobox" aria-expanded="true"><ul id="palList" role="listbox"></ul><footer><span>↑↓ wählen</span><span>↵ ausführen</span><span>esc schließen</span></footer></div></div>
<script>
const THEMES={studioDark:["Studio Dark","#0E0F12","#F4F1EA","#FFB224","rgba(255,178,36,.22)",.4,"16,99"],broadcastClassic:["Broadcast Classic","#000000","#FFFFFF","#FFE14D","rgba(255,225,77,.25)",.4,"21,00"],daylight:["Daylight","#FAF8F3","#1A1A1A","#C2410C","rgba(194,65,12,.14)",.45,"16,40"],highContrast:["High Contrast","#000000","#FFE14D","#FFFFFF","rgba(255,255,255,.3)",.55,"16,13"],lowLight:["Low Light","#120D08","#C9B79A","#B5542C","rgba(181,84,44,.25)",.45,"9,87"],dyslexia:["Dyslexia","#FDF6E3","#1F2A44","#2563EB","rgba(37,99,235,.14)",.45,"13,22"]};
const STATES={idle:["Voice aus","circle-o"],listening:["Hört zu…","circle-p"],tracking:["Folgt · 142 WPM","circle"],hold:["Wartet","pause"],lost:["Verloren – Wort klicken","tri"],resync:["Springt…","arc"]};
const SCRIPT=[["Einstieg","Guten Abend und herzlich willkommen. Heute zeige ich Ihnen einen Teleprompter, der zuhört. [PAUSE] Er folgt Ihrer Stimme, wartet, wenn Sie frei sprechen, und findet zurück, wenn Sie springen."],["Demo","Alles läuft lokal auf Ihrem Rechner. Kein Konto, keine Cloud, kein Abo. Das Sprachmodell für Deutsch ist nur einundsiebzig Megabyte groß und startet in unter einer Sekunde."],["Lesbarkeit","Sechs Themes sind auf Kontrast geprüft, von Studio Dark bis Dyslexia. Die Fokuslinie sitzt auf fünfunddreißig Prozent der Höhe, gelesener Text wird sanft gedimmt."],["Fazit","Probieren Sie es aus: Text einfügen, Leertaste drücken, sprechen. Der Rest passiert von selbst. Vielen Dank."]];
const $=id=>document.getElementById(id),root=document.documentElement;
let words=[],paras=[],y=0,v=0,playing=false,wpm=140,theme="studioDark",vs="idle",last=0,maxY=0,pad=0;
// build script
const sc=$("script");SCRIPT.forEach(([h,t],pi)=>{const p=document.createElement("p");p.dataset.i=pi;paras.push(p);
 t.split(/(\[[^\]]+\])|\s+/).filter(Boolean).forEach(tok=>{const s=document.createElement("span");s.textContent=tok;s.className=tok.startsWith("[")?"dir":"w";if(s.className=="w"){s.dataset.i=words.length;words.push(s)}p.append(s," ")});sc.append(p);
 const b=document.createElement("button");b.textContent=(pi+1)+"  "+h;b.onclick=()=>jumpTo(p.offsetTop);$("ol").append(b)});
function layout(){const H=$("stage").clientHeight;pad=H*.35;$("scroller").style.paddingTop=pad+"px";$("scroller").style.paddingBottom=H*.6+"px";maxY=sc.offsetHeight;}
function pxPerSec(){const fs=parseFloat(getComputedStyle(sc).fontSize),lh=fs*parseFloat(getComputedStyle(root).getPropertyValue("--pr-lh"));const wpl=Math.max(3,sc.clientWidth/(fs*2.9));return wpm/60/wpl*lh}
let target=null;
function tick(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
 const want=playing?pxPerSec():0;v+=(want-v)*Math.min(1,dt/0.15); // ~600ms ease
 if(target!==null){const d=target-y;y+=d*Math.min(1,dt*12);if(Math.abs(d)<.5){y=target;target=null}}else y+=v*dt;
 y=Math.max(0,Math.min(maxY,y));if(y>=maxY&&playing)toggle(false);
 $("scroller").style.transform=`translate3d(0,${-y}px,0)`;updateRead();
 $("pg").style.width=(y/maxY*100)+"%";const s=Math.round(y/Math.max(1,pxPerSec()));$("tc").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
 requestAnimationFrame(tick)}
function updateRead(){const line=y+pad+2;let cur=null;for(const w of words){w.classList.toggle("read",w.offsetTop+w.offsetHeight<line);if(!cur&&w.offsetTop+w.offsetHeight>=line)cur=w}
 words.forEach(w=>w.classList.toggle("cur",vs==="tracking"&&w===cur))}
function jumpTo(py){target=Math.max(0,py-pad);if(vs!=="idle"){setState("resync");setTimeout(()=>setState("tracking"),300)}}
function toggle(p=!playing){if(p&&!playing){countdown(()=>{playing=true;btn()})}else{playing=false;btn()}}
function btn(){$("play").textContent=playing?"❚❚":"▶";$("play").setAttribute("aria-label",playing?"Pause":"Play")}
function countdown(cb){const cd=$("cd");let n=3;cd.classList.add("on");const step=()=>{if(n===0){cd.classList.remove("on");cd.innerHTML="";cb();return}cd.innerHTML=`<span>${n}</span>`;n--;cdT=setTimeout(step,1000)};step()}
let cdT;
function setWpm(n){wpm=Math.max(60,Math.min(300,n));$("wpm").textContent=wpm}
function setTheme(k){theme=k;const t=THEMES[k];const s=root.style;s.setProperty("--pr-bg",t[1]);s.setProperty("--pr-text",t[2]);s.setProperty("--pr-marker",t[3]);s.setProperty("--pr-hl",t[4]);s.setProperty("--pr-read",t[5]);$("rd").value=t[5]*100;$("rdv").textContent=Math.round(t[5]*100)+" %";
 s.setProperty("--pr-ls",k==="dyslexia"?.04:0);s.setProperty("--pr-ws",k==="dyslexia"?.16:0);s.setProperty("--pr-lh",k==="dyslexia"?1.6:1.4);
 document.querySelectorAll(".th").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));requestAnimationFrame(layout)}
Object.entries(THEMES).forEach(([k,t],i)=>{const b=document.createElement("button");b.className="th";b.dataset.k=k;b.title=`${t[0]} (${i+1})`;b.innerHTML=`<div class="sw" style="background:${t[1]};color:${t[2]}">Aa <span style="margin-left:auto;width:16px;height:2px;background:${t[3]}"></span></div><div class="nm"><span>${t[0]}</span><span style="color:var(--muted)">${t[6]}:1</span></div>`;b.onclick=()=>setTheme(k);$("themes").append(b)});
const ICON={"circle-o":c=>`<svg class="ic" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`,"circle-p":c=>`<svg class="ic" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="${c}"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle></svg>`,circle:c=>`<svg class="ic" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="${c}"/></svg>`,pause:c=>`<svg class="ic" viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9" rx="1" fill="${c}"/><rect x="7" y="1.5" width="3" height="9" rx="1" fill="${c}"/></svg>`,tri:c=>`<svg class="ic" viewBox="0 0 12 12"><path d="M6 1 11.5 11H.5Z" fill="${c}"/><path d="M6 4.5v3M6 9v.5" stroke="#000" stroke-width="1.3"/></svg>`,arc:c=>`<svg class="ic" viewBox="0 0 12 12"><path d="M2 6a4 4 0 1 1 4 4" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 6 6" to="360 6 6" dur=".8s" repeatCount="indefinite"/></path></svg>`};
function setState(s){vs=s;const[l,ic]=STATES[s];const c=`var(--s-${s})`;$("vstate").innerHTML=ICON[ic](getComputedStyle(root).getPropertyValue("--s-"+s).trim())+`<span>${l}</span>`;$("vstate").style.borderColor=s==="lost"?c:"";$("vstate").setAttribute("aria-live",s==="lost"?"assertive":"polite");$("marker").classList.toggle("hold",s==="hold");
 if(s==="hold"&&playing){playing=false;btn()}}
const order=Object.keys(STATES);$("vstate").onclick=()=>setState(order[(order.indexOf(vs)+1)%order.length]);
sc.addEventListener("click",e=>{if(e.target.classList.contains("w"))jumpTo(e.target.offsetTop)});
function para(d){const ps=paras.map(p=>p.offsetTop);let i=ps.findIndex(p=>p>y+5);if(i<0)i=ps.length;i=d>0?i:Math.max(0,i-2);jumpTo(ps[Math.min(i,ps.length-1)])}
$("play").onclick=()=>toggle();$("home").onclick=()=>jumpTo(0);$("pPrev").onclick=()=>para(-1);$("pNext").onclick=()=>para(1);$("wUp").onclick=()=>setWpm(wpm+5);$("wDn").onclick=()=>setWpm(wpm-5);
$("mirBtn").onclick=()=>{const on=$("mir").classList.toggle("h");$("mirBtn").setAttribute("aria-pressed",on)};
$("fs").oninput=e=>{root.style.setProperty("--fs",e.target.value+"px");$("fsv").textContent=e.target.value+" px";layout()};$("fsv").textContent="40 px";
$("rd").oninput=e=>{root.style.setProperty("--pr-read",e.target.value/100);$("rdv").textContent=e.target.value+" %"};
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#modeSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));setState(b.dataset.m==="voice"?"listening":"idle")});
document.querySelectorAll(".toolbar .seg:first-child button").forEach(b=>b.onclick=()=>document.querySelectorAll(".toolbar .seg:first-child button").forEach(x=>x.setAttribute("aria-pressed",x===b)));
$("uiTheme").onclick=()=>{const d=root.dataset.theme==="dark"||(!root.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);root.dataset.theme=d?"light":"dark"};
// palette
const CMDS=[["Play / Pause","Space",()=>toggle()],["Zum Anfang","Home",()=>jumpTo(0)],["Spiegeln horizontal","M",()=>$("mirBtn").click()],["Tempo +5 WPM","↑",()=>setWpm(wpm+5)],["Tempo −5 WPM","↓",()=>setWpm(wpm-5)],["Voice-Zustand weiterschalten","V",()=>$("vstate").click()],["UI hell/dunkel","",()=>$("uiTheme").click()],...Object.entries(THEMES).map(([k,t],i)=>["Theme: "+t[0]+"  ("+t[6]+":1)",String(i+1),()=>setTheme(k)])];
let sel=0,flt=CMDS;
function renderPal(){const q=$("palIn").value.toLowerCase();flt=CMDS.filter(c=>c[0].toLowerCase().includes(q));sel=Math.min(sel,Math.max(0,flt.length-1));
 $("palList").innerHTML=flt.length?flt.map((c,i)=>`<li role="option" aria-selected="${i===sel}" class="${i===sel?"sel":""}" data-i="${i}"><span>${c[0]}</span>${c[1]?`<kbd>${c[1]}</kbd>`:""}</li>`).join(""):`<li style="color:var(--muted)">Keine Aktion für „${q}“</li>`}
function openPal(o){$("pal").classList.toggle("on",o);if(o){$("palIn").value="";sel=0;renderPal();$("palIn").focus()}}
$("palBtn").onclick=()=>openPal(true);$("pal").onclick=e=>{if(e.target.id==="pal")openPal(false)};$("palIn").oninput=()=>{sel=0;renderPal()};
$("palList").onclick=e=>{const li=e.target.closest("li[data-i]");if(li){openPal(false);flt[li.dataset.i][2]()}};
$("palIn").onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(flt.length-1,sel+1);renderPal();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);renderPal();e.preventDefault()}else if(e.key==="Enter"&&flt[sel]){openPal(false);flt[sel][2]()}else if(e.key==="Escape")openPal(false)};
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal(!$("pal").classList.contains("on"));return}
 if($("pal").classList.contains("on")||e.target.tagName==="INPUT")return;
 const k=e.key;if(k===" "){e.preventDefault();toggle()}else if(k==="ArrowUp"){e.preventDefault();setWpm(wpm+5)}else if(k==="ArrowDown"){e.preventDefault();setWpm(wpm-5)}else if(k==="PageDown"){e.preventDefault();para(1)}else if(k==="PageUp"){e.preventDefault();para(-1)}else if(k==="Home")jumpTo(0);else if(k==="m"||k==="M")$("mirBtn").click();else if(k==="v"||k==="V")$("vstate").click();else if(k==="Escape"){clearTimeout(cdT);$("cd").classList.remove("on");toggle(false)}else if(/^[1-6]$/.test(k))setTheme(Object.keys(THEMES)[k-1])});
addEventListener("resize",layout);
setTheme("studioDark");setState("idle");layout();requestAnimationFrame(tick);
</script>
</body>
</html>
