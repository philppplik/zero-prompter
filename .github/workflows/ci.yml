name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly: extended property tests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS overrides .cargo/config.toml -> Windows jobs re-add +crt-static.
  RUSTFLAGS: -D warnings

jobs:
  # Pure crates: fast, no system deps (default-members excludes the app).
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # sherpa-onnx-sys unpacks its prebuilt libs to target/sherpa-onnx-prebuilt;
      # cache it too, else a restored build-script output points to a missing dir.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: target/sherpa-onnx-prebuilt
      - name: fmt
        if: runner.os == 'Linux'
        # Prints an applicable unified diff on failure (git apply).
        run: cargo fmt --all && git diff --exit-code
      - name: clippy (crates)
        run: cargo clippy --all-targets
      # default-members include zt-testkit, so this runs unit tests, tests/
      # integration tests (proptest, state-machine tables, alignment fixtures,
      # MockEngine pipeline) and doctests of all pure crates.
      - name: test (crates)
        run: cargo test --all-targets
      - name: doctests (crates)
        run: cargo test --doc

  # Minimum supported Rust version (workspace.package.rust-version) incl. dev-deps.
  msrv:
    name: MSRV 1.80 (tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.80
      # sherpa-onnx-sys unpacks its prebuilt libs to target/sherpa-onnx-prebuilt;
      # cache it too, else a restored build-script output points to a missing dir.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: target/sherpa-onnx-prebuilt
      # Cargo.lock is committed and generated MSRV-aware (lockfiles.yml).
      # `+1.80` overrides rust-toolchain.toml (channel = stable).
      - run: cargo +1.80 test --all-targets --locked

  # Many more proptest cases, weekly and on demand (not on every push).
  proptest-extended:
    name: Property tests (extended)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      PROPTEST_CASES: "8192"
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      # sherpa-onnx-sys unpacks its prebuilt libs to target/sherpa-onnx-prebuilt;
      # cache it too, else a restored build-script output points to a missing dir.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: target/sherpa-onnx-prebuilt
      - run: cargo test --release -p zt-align -p zt-core -p zt-testkit
      - name: Keep failing seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: "**/proptest-regressions/**"

  # Adapters behind feature flags (cpal needs ALSA headers on Linux).
  adapters:
    name: Adapters cpal/sherpa (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      # sherpa-onnx-sys unpacks its prebuilt libs to target/sherpa-onnx-prebuilt;
      # cache it too, else a restored build-script output points to a missing dir.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Linux audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build -p zt-audio --features cpal
      - run: cargo build -p zt-stt --features sherpa

  # End-to-end STT smoke: real models (models.json, SHA-checked, cached),
  # real sherpa-onnx, real audio. Proves recognizer creation (incl. the
  # legacy bpe_vocab bug reproduction), hotwords, text, RTF and latency.
  stt-smoke:
    name: STT smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-stt-smoke
          cache-directories: target/sherpa-onnx-prebuilt
      - name: Reset incomplete sherpa-onnx prebuilt (stale cache guard)
        shell: bash
        run: |
          for d in target/sherpa-onnx-prebuilt/*/; do
            [ -d "$d" ] || continue
            if ! ls "$d"lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              echo "incomplete prebuilt: $d"; rm -r "$d"
            fi
          done
          find target -maxdepth 3 -name 'sherpa-onnx-sys-*' -path '*release*' -prune -exec rm -r {} + || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: stt-cache
          key: stt-models-${{ hashFiles('apps/desktop/src-tauri/resources/models.json', 'scripts/stt-smoke.py') }}
      - name: Build smoke example
        run: cargo build --release -p zt-stt --features sherpa --example smoke
      - name: psutil (peak RSS sampling)
        shell: bash
        run: python -m pip install --quiet psutil || echo "psutil unavailable, no RAM column"
      - name: Smoke (Nemotron 3.5 160 ms, Kroko DE, Kroko EN, Zipformer EN 20M)
        shell: bash
        run: python scripts/stt-smoke.py stt-cache nemotron-3.5-streaming-0.6b-160ms-int8 zipformer-de-kroko-2025-08-06 zipformer-en-kroko-2025-08-06 zipformer-en-20m-2023-02-17
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist

  app:
    name: Tauri app (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # sherpa-onnx-sys unpacks its prebuilt libs to target/sherpa-onnx-prebuilt;
      # cache it too, else a restored build-script output points to a missing dir.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-directories: target/sherpa-onnx-prebuilt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Linux deps (WebKitGTK 4.1, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - name: Icons
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.png
      - name: clippy (app)
        run: cargo clippy -p zero-teleprompter --all-targets
      - name: clippy (app, sherpa)
        run: cargo clippy -p zero-teleprompter --all-targets --features sherpa
      - name: test (app)
        run: cargo test -p zero-teleprompter
      # A partially restored cache (lockfile changed) can contain
      # target/sherpa-onnx-prebuilt/<archive>/lib without the libraries (the
      # sherpa build script trusts an existing lib dir). Drop such dirs and the
      # cached build-script output so the libs are downloaded again.
      - name: Reset incomplete sherpa-onnx prebuilt (stale cache guard)
        shell: bash
        run: |
          ls -la target/sherpa-onnx-prebuilt target/sherpa-onnx-prebuilt/*/lib 2>/dev/null | head -n 30 || true
          for d in target/sherpa-onnx-prebuilt/*/; do
            [ -d "$d" ] || continue
            if ! ls "$d"lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
              echo "incomplete prebuilt: $d"; rm -r "$d"
            fi
          done
          find target -maxdepth 3 -name 'sherpa-onnx-sys-*' -path '*release*' -prune -exec rm -r {} + || true
      - name: Release build (binary size, informational)
        shell: bash
        run: cargo build -p zero-teleprompter --release --features sherpa && ls -la target/release | head -n 40
      - name: No VC++ runtime imports (dumpbin)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-crt.ps1 target/release/zero-teleprompter.exe

  licenses:
    name: Licenses (cargo-deny + npm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Static MSVC CRT (mirrors .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-D warnings -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm licence allow-list (no GPL/AGPL/LGPL)
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx --yes license-checker-rseidelsohn --production --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;OFL-1.1;CC0-1.0;Unlicense;MIT OR Apache-2.0;Apache-2.0 OR MIT" --excludePrivatePackages
