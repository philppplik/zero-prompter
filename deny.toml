# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
# VERIFY: schema matches the installed cargo-deny version (>= 0.14 uses `version = 2`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error: unmaintained (not a vulnerability), only transitively via
    # the Tauri/GTK3 build tree (glib-macros, gtk3-macros); no alternative until Tauri drops GTK3.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri/gtk3, build-time proc-macro only" },
    # unic-* (unmaintained, no fix): transitive via tauri-utils -> urlpattern.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils/urlpattern, no upgrade available" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils/urlpattern, no upgrade available" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils/urlpattern, no upgrade available" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils/urlpattern, no upgrade available" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils/urlpattern, no upgrade available" },
    # quick-xml < 0.41 (DoS on untrusted XML): pinned by Tauri deps (plist etc.); the app parses no untrusted XML. Revisit on Tauri update.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via tauri tree, no untrusted XML input" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via tauri tree, no untrusted XML input" },
    # time < 0.3.47 (stack exhaustion when parsing): fixed version needs a newer Rust than MSRV 1.80; lockfile is MSRV-resolved. No untrusted time strings parsed.
    { id = "RUSTSEC-2026-0009", reason = "time held back by MSRV-aware lockfile; no untrusted format parsing" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# GPL/AGPL/LGPL are intentionally NOT allowed (QPrompt/Imaginary are UX reference only).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    # Tauri / WebView / TLS dependency tree (VERIFY against `cargo deny check licenses`):
    "MPL-2.0",              # cssparser/selectors via tauri-utils (file-level copyleft, unmodified use)
    "BSL-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots (ureq/rustls)
    "OpenSSL",              # older ring releases
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # deprecated/archived, see RESEARCH.md
    { name = "sherpa-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
